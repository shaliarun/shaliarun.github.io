<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportZone AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f2f4f3; --surface:#ffffff; --surface2:#f4f6f5; --border:#dde2de;
    --accent:#066858; --accent-h:#054f43; --accent2:#e6f2f0;
    --text:#1a1a1a; --text2:#445048; --muted:#7a8c80;
    --success:#066858; --success-bg:#e6f2f0;
    --warn:#d4821a; --red:#c0392b; --red-bg:#fdf0ef;
  }

  /* ═══ RESET & BASE ═══ */
  *{box-sizing:border-box;margin:0;padding:0;}
  html{height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--text);font-family:'Source Sans 3',sans-serif;height:100vh;max-height:100vh;display:flex;flex-direction:row;overflow:hidden;align-items:stretch;}

  /* ═══ SIDEBAR ═══ */
  .sidebar{width:228px;height:100%;background:var(--accent);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
  .brand{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,0.15);flex-shrink:0;}
  .brand-name{font-family:'Oswald',sans-serif;font-weight:700;font-size:25px;letter-spacing:1px;color:#fff;line-height:1;}
  .brand-name span{color:#9eddd4;}
  .brand-tag{font-size:10px;color:rgba(255,255,255,0.55);margin-top:3px;text-transform:uppercase;letter-spacing:2px;}
  .sb-nav{flex:1;min-height:0;overflow-y:auto;}
  .sb-nav::-webkit-scrollbar{width:0;}
  .sb-section{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .sb-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.45);margin-bottom:7px;font-weight:600;}
  .qbtn{display:flex;align-items:center;padding:8px 10px;border-radius:5px;border:none;background:transparent;color:rgba(255,255,255,0.88);font-family:'Source Sans 3',sans-serif;font-size:13px;cursor:pointer;width:100%;text-align:left;transition:background 0.15s;margin-bottom:1px;font-weight:500;justify-content:space-between;}
  .qbtn:hover{background:rgba(255,255,255,0.13);}
  .qbtn .qbtn-label{flex:1;}
  .sb-badge{background:#fff;color:var(--accent);font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:20px;padding:0 4px;display:flex;align-items:center;justify-content:center;}
  .sb-footer{flex-shrink:0;padding:12px 14px;border-top:1px solid rgba(255,255,255,0.1);}
  .user-pill{display:flex;align-items:center;gap:9px;padding:9px;background:rgba(255,255,255,0.11);border-radius:7px;}
  .avatar{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
  .user-info .uname{font-size:13px;font-weight:600;color:#fff;}
  .user-info .utag{font-size:11px;color:#9eddd4;}

  /* ═══ MAIN ═══ */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative;height:100%;}

  /* ═══ HEADER ═══ */
  .chat-header{padding:0 20px;height:54px;border-bottom:3px solid var(--accent);display:flex;align-items:center;gap:12px;background:var(--surface);flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
  .ai-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .hdr-title{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.5px;}
  .hdr-sub{font-size:11px;color:var(--accent);font-weight:600;margin-top:1px;}

  /* ═══ BODY (chat + panels) ═══ */
  .body-wrap{flex:1;min-height:0;display:flex;overflow:hidden;position:relative;}
  .chat-col{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;transition:margin-right 0.35s cubic-bezier(.4,0,.2,1);}
  .chat-col.shift-right{margin-right:340px;}

  .chat-messages{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;background:var(--bg);}
  .chat-messages::-webkit-scrollbar{width:4px;}
  .chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

  .msg{display:flex;gap:10px;animation:fup 0.28s ease;}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;max-width:80%;}
  .msg.ai{align-self:stretch;width:100%;}
  .msg.ai.narrow-msg{align-self:flex-start;width:auto;max-width:78%;}
  .msg.ai.track-msg{align-self:flex-start;width:auto;min-width:340px;max-width:78%;}
  @keyframes fup{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .msg-av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:3px;}
  .bubble{padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.65;min-width:0;flex:1;}
  .msg.ai .bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:3px;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.05);overflow:hidden;}
  .msg.user .bubble{background:var(--accent);color:#fff;border-top-right-radius:3px;}

  /* ═══ INPUT AREA ═══ */
  .input-area{padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;}
  .inp-wrap{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;transition:border-color 0.2s;}
  .inp-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(6,104,88,0.1);}
  #chat-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Source Sans 3',sans-serif;font-size:13.5px;}
  #chat-input::placeholder{color:var(--muted);}
  .send-btn{width:34px;height:34px;border-radius:6px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:background 0.15s;flex-shrink:0;}
  .send-btn:hover{background:var(--accent-h);}

  /* ═══ SHARED PANEL STYLES ═══ */
  .side-panel{position:absolute;top:0;bottom:0;width:340px;background:var(--surface);display:flex;flex-direction:column;z-index:50;box-shadow:-3px 0 18px rgba(0,0,0,0.1);transition:transform 0.35s cubic-bezier(.4,0,.2,1);}
  .side-panel.right{right:0;border-left:1px solid var(--border);transform:translateX(100%);}
  .side-panel.right.open{transform:translateX(0);}
  .side-panel.cart-panel{right:0;border-left:1px solid var(--border);transform:translateX(100%);}
  .side-panel.cart-panel.open{transform:translateX(0);}

  .panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface2);flex-shrink:0;}
  .panel-hdr-title{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text2);}
  .panel-close{width:28px;height:28px;border-radius:5px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all 0.15s;}
  .panel-close:hover{background:var(--red-bg);border-color:var(--red);color:var(--red);}

  /* ═══ PRODUCT DETAIL PANEL ═══ */
  .panel-body{flex:1;overflow-y:auto;padding:0;}
  .panel-body::-webkit-scrollbar{width:3px;}
  .panel-body::-webkit-scrollbar-thumb{background:var(--border);}

  .panel-img-wrap{width:100%;height:200px;overflow:hidden;background:#f0f5f3;flex-shrink:0;}
  .panel-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .panel-info{padding:16px;}
  .panel-brand-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:4px;}
  .panel-pname{font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;line-height:1.2;color:var(--text);margin-bottom:6px;}
  .panel-price{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:var(--accent);margin-bottom:4px;}
  .panel-rating{font-size:12.5px;color:var(--warn);margin-bottom:12px;}
  .panel-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .spec-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .spec-row:last-child{border-bottom:none;}
  .spec-row .slbl{color:var(--muted);}
  .spec-row .sval{font-weight:600;color:var(--text);}

  /* Size selector */
  .size-section{margin:12px 0 8px;}
  .size-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:0.5px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;}
  .size-label span{color:var(--accent);font-weight:700;}
  .size-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .size-btn{padding:5px 10px;border-radius:5px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:11.5px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:'Source Sans 3',sans-serif;}
  .size-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent2);}
  .size-btn.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
  .size-required{font-size:11px;color:var(--red);margin-top:6px;display:none;}
  .size-required.show{display:block;}

  .panel-actions{padding:14px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;flex-shrink:0;background:var(--surface);}
  /* ── PANEL BUTTONS (pbtn) ── */
  .pbtn{padding:12px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Source Sans 3',sans-serif;text-align:center;text-transform:uppercase;letter-spacing:0.5px;transition:all 0.15s;border:2px solid transparent;display:block;width:100%;}

  /* Primary — brand green: Add to Cart, Reorder */
  .pbtn-solid{background:var(--accent);color:#fff;border-color:var(--accent);}
  .pbtn-solid:hover{background:var(--accent-h);border-color:var(--accent-h);}

  /* Secondary — outlined green: secondary actions */
  .pbtn-outline{background:transparent;border-color:var(--accent);color:var(--accent);}
  .pbtn-outline:hover{background:var(--accent2);}

  /* Confirmed state */
  .pbtn-added{background:#e8f5f2;color:var(--accent);border-color:var(--accent);}

  /* Buy Now — deep navy: immediate purchase */
  .pbtn-navy{background:#1e3a5f;color:#fff;border-color:#1e3a5f;}
  .pbtn-navy:hover{background:#162e4d;border-color:#162e4d;}

  /* View Details — steel blue outline */
  .pbtn-slate{background:transparent;border-color:#1e3a5f;color:#1e3a5f;}
  .pbtn-slate:hover{background:#edf2f8;}

  /* Complaint / Warning — warm amber */
  .pbtn-amber{background:#c97a1a;color:#fff;border-color:#c97a1a;}
  .pbtn-amber:hover{background:#a86314;border-color:#a86314;}

  /* Return / Destructive — muted red */
  .pbtn-red{background:#b83232;color:#fff;border-color:#b83232;}
  .pbtn-red:hover{background:#962828;border-color:#962828;}

  /* ── PRODUCT CARD BUTTONS (pc-btn) ── */
  .pc-btn{width:100%;padding:6px 4px;border-radius:4px;font-size:9.5px;font-weight:700;cursor:pointer;font-family:'Source Sans 3',sans-serif;text-transform:uppercase;letter-spacing:0.2px;transition:all 0.15s;text-align:center;border:2px solid transparent;}
  /* Add to Cart on card — solid green */
  .pc-btn-solid{background:var(--accent);color:#fff;border-color:var(--accent);}
  .pc-btn-solid:hover{background:var(--accent-h);border-color:var(--accent-h);}
  /* View Details on card — navy outline */
  .pc-btn-outline{background:transparent;border-color:#1e3a5f !important;color:#1e3a5f;}
  .pc-btn-outline:hover{background:#edf2f8;}

  /* ── CHAT ACTION BUTTONS (action-btn) ── */
  .action-btn{padding:7px 14px;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-family:'Source Sans 3',sans-serif;transition:all 0.15s;text-transform:uppercase;letter-spacing:0.3px;}
  .action-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent2);}

  /* ── CHECKOUT & CART BUTTONS ── */
  .cp-checkout-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Source Sans 3',sans-serif;text-transform:uppercase;letter-spacing:0.5px;transition:background 0.15s;}
  .cp-checkout-btn:hover{background:var(--accent-h);}
  .co-next-btn{width:100%;padding:13px;background:#1e3a5f;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Source Sans 3',sans-serif;text-transform:uppercase;letter-spacing:0.5px;transition:background 0.15s;}
  .co-next-btn:hover{background:#162e4d;}
  .co-next-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;}

  /* ── SUGGESTION CHIPS ── */
  .sug-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
  .sug{padding:5px 12px;border-radius:20px;background:var(--surface2);border:1.5px solid var(--border);font-size:11.5px;cursor:pointer;color:var(--text2);font-family:'Source Sans 3',sans-serif;font-weight:600;transition:all 0.15s;}
  .sug:hover{border-color:var(--accent);color:var(--accent);background:var(--accent2);}

  /* ═══ CART PANEL ═══ */
  .cart-panel-body{flex:1;overflow-y:auto;padding:0 16px;}
  .cart-panel-body::-webkit-scrollbar{width:3px;}
  .cart-panel-body::-webkit-scrollbar-thumb{background:var(--border);}
  .cart-empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px;}
  .cart-empty-icon{font-size:40px;margin-bottom:10px;opacity:0.4;}

  .cp-item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--border);align-items:center;}
  .cp-item:last-child{border-bottom:none;}
  .cp-item-img{width:52px;height:52px;border-radius:6px;object-fit:cover;background:var(--surface2);flex-shrink:0;}
  .cp-item-info{flex:1;min-width:0;}
  .cp-item-brand{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--accent);letter-spacing:0.5px;}
  .cp-item-name{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.3;margin-top:1px;}
  .cp-item-price{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;color:var(--accent);margin-top:3px;}
  .cp-remove{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 4px;transition:color 0.15s;flex-shrink:0;}
  .cp-remove:hover{color:var(--red);}

  .cart-panel-footer{padding:14px 16px;border-top:1px solid var(--border);background:var(--surface2);flex-shrink:0;}
  .cp-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .cp-total-lbl{font-size:12px;color:var(--muted);font-weight:600;}
  .cp-total-amt{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--accent);}
  .cp-ship-note{font-size:11px;color:var(--muted);margin-bottom:10px;}

  /* ═══ CHECKOUT PANEL ═══ */
  .side-panel.checkout-panel{right:0;border-left:1px solid var(--border);transform:translateX(100%);z-index:70;}
  .side-panel.checkout-panel.open{transform:translateX(0);}

  /* Step progress bar */
  .co-steps{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface2);flex-shrink:0;gap:0;}
  .co-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
  .co-step-dot{width:26px;height:26px;border-radius:50%;background:var(--border);color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all 0.3s;border:2px solid var(--border);}
  .co-step.active .co-step-dot{background:#1e3a5f;color:#fff;border-color:#1e3a5f;box-shadow:0 0 0 3px rgba(30,58,95,0.15);}
  .co-step.done .co-step-dot{background:#1e3a5f;color:#fff;border-color:#1e3a5f;}
  .co-step-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-top:4px;text-align:center;}
  .co-step.active .co-step-lbl,.co-step.done .co-step-lbl{color:#1e3a5f;}
  .co-step-line{flex:1;height:2px;background:var(--border);margin-bottom:14px;transition:background 0.3s;}
  .co-step-line.done{background:#1e3a5f;}

  /* Checkout body */
  .co-body{flex:1;overflow-y:auto;padding:16px;}
  .co-body::-webkit-scrollbar{width:3px;}
  .co-body::-webkit-scrollbar-thumb{background:var(--border);}

  .co-section-title{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;text-transform:uppercase;color:var(--text);margin-bottom:12px;letter-spacing:0.5px;}

  /* Address cards */
  .addr-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .addr-card{padding:12px;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;transition:all 0.15s;background:var(--surface);}
  .addr-card:hover{border-color:var(--accent);background:var(--accent2);}
  .addr-card.selected{border-color:var(--accent);background:var(--accent2);}
  .addr-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .addr-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:2px 8px;border-radius:3px;background:var(--accent);color:#fff;}
  .addr-tag.work{background:#3563c4;}
  .addr-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;}
  .addr-line{font-size:12px;color:var(--muted);line-height:1.5;}
  .addr-select-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);transition:all 0.15s;flex-shrink:0;}
  .addr-card.selected .addr-select-dot{background:var(--accent);border-color:var(--accent);}
  .addr-add-btn{width:100%;padding:10px;border:1.5px dashed var(--border);border-radius:7px;background:transparent;color:var(--muted);font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;}
  .addr-add-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* Delivery options */
  .delivery-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
  .del-opt{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;transition:all 0.15s;gap:10px;}
  .del-opt:hover{border-color:#c97a1a;background:#fdf3e7;}
  .del-opt.selected{border-color:#c97a1a;background:#fdf3e7;}
  .del-opt-left{display:flex;flex-direction:column;gap:2px;flex:1;}
  .del-opt-name{font-size:13px;font-weight:600;color:var(--text);}
  .del-opt.selected .del-opt-name{color:#a86314;}
  .del-opt-sub{font-size:11px;color:var(--muted);}
  .del-opt-price{font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;color:#c97a1a;}
  .del-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;transition:all 0.15s;}
  .del-opt.selected .del-dot{background:#c97a1a;border-color:#c97a1a;}

  /* Order summary in checkout */
  .co-order-mini{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:12px;margin-bottom:14px;}
  .co-order-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
  .co-order-row.total{border-top:1.5px solid var(--accent);margin-top:6px;padding-top:8px;font-weight:700;font-size:14px;color:var(--accent);}
  .co-order-row .lbl{color:var(--muted);}

  /* Payment methods */
  .pay-methods{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .pay-card{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;transition:all 0.15s;}
  .pay-card:hover,.pay-card.selected{border-color:var(--accent);background:var(--accent2);}
  .pay-icon{width:38px;height:28px;border-radius:4px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;font-family:'Oswald',sans-serif;}
  .pay-icon.upi{color:#5f00a3;font-size:11px;}
  .pay-icon.card{color:#1a1a1a;font-size:11px;}
  .pay-icon.net{color:#066858;font-size:10px;}
  .pay-icon.cod{color:#d4821a;font-size:10px;}
  .pay-info{flex:1;}

  .osc-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}

  .osc-info{min-width:0;}

  .osc-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

  .st-active{background:#fff3e0;color:#d4821a;border:1px solid #f0c070;}
  .st-done{background:var(--success-bg);color:var(--accent);border:1px solid rgba(6,104,88,0.3);}

  .osc-arrow{color:var(--muted);font-size:16px;font-weight:700;}

  .typing{display:flex;align-items:center;gap:5px;padding:5px 2px;}

  .typing span:nth-child(2){animation-delay:0.2s;}
  .typing span:nth-child(3){animation-delay:0.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.2;}40%{opacity:1;}}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:8px 18px;border-radius:4px;opacity:0;pointer-events:none;transition:all 0.3s;z-index:999;}

───────────────────────────────────────── */
function selectSize(size){
  state.selectedSize = size;
  // update button styles
  document.querySelectorAll('.size-btn').forEach(btn=>{
    btn.classList.toggle('selected', btn.dataset.size === size);
  });
  // update label
  const lbl = document.getElementById('size-chosen');
  if(lbl) lbl.textContent = size;
  // hide error if shown
  const err = document.getElementById('size-error');
  if(err) err.classList.remove('show');
}

function openDetailPanel(id){
  const p=getProduct(id); if(!p) return;
  state.panelProduct=p;
  state.selectedSize=p.sizes.length===1 ? p.sizes[0] : null; // auto-select if only one size
  const inCart=!!state.cart.find(i=>i.id===id);
  const img=IMG[id]||'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400&h=300&fit=crop';

  const sizeButtons = p.sizes.map(s=>`
    <button class="size-btn${state.selectedSize===s?' selected':''}" data-size="${s}" onclick="selectSize('${s}')">${s}</button>
  `).join('');

  const sizeSection = `
    <div class="size-section">
      <div class="size-label">
        Select Size
        <span id="size-chosen">${state.selectedSize||''}</span>
      </div>
      <div class="size-grid">${sizeButtons}</div>
      <div class="size-required" id="size-error">Please select a size to continue</div>
    </div>`;

  document.getElementById('panel-body').innerHTML=`
    <div class="panel-img-wrap"><img src="${img}" alt="${p.name}" loading="lazy"></div>
    <div class="panel-info">
      <div class="panel-brand-tag">${p.brand}</div>
      <div class="panel-pname">${p.name}</div>
      <div class="panel-price">&#8377;${p.price.toLocaleString()}</div>
      <div class="panel-rating">${stars(p.rating)}</div>
      <p class="panel-desc">${p.desc}</p>
      ${sizeSection}
      <div class="spec-row"><span class="slbl">Brand</span><span class="sval">${p.brand}</span></div>
      <div class="spec-row"><span class="slbl">Delivery</span><span class="sval">${p.delivery}</span></div>
      <div class="spec-row"><span class="slbl">Shipping</span><span class="sval">${p.shipping===0?'FREE':'&#8377;'+p.shipping}</span></div>
      <div class="spec-row"><span class="slbl">Return</span><span class="sval">7-day easy return</span></div>
      <div class="spec-row"><span class="slbl">In Stock</span><span class="sval" style="color:var(--accent)">Available</span></div>
    </div>`;

  document.getElementById('panel-actions').innerHTML=`
    <button class="pbtn ${inCart?'pbtn-added':'pbtn-solid'}" id="panel-cart-btn" onclick="panelAddToCart()">
      ${inCart?'Added to Cart':'Add to Cart'}
    </button>
    <button class="pbtn pbtn-navy" onclick="panelBuyNow()">Buy Now</button>`;

  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('cart-panel').classList.remove('open');
  document.getElementById('chat-col').classList.add('shift-right');
}

function requireSize(){
  if(!state.selectedSize){
    const err=document.getElementById('size-error');
    if(err){ err.classList.add('show'); err.scrollIntoView({behavior:'smooth',block:'nearest'}); }
    return false;
  }
  return true;
}

function closeDetailPanel(){
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('chat-col').classList.remove('shift-right');
}

function panelAddToCart(){
  if(!requireSize()) return;
  if(!state.panelProduct) return;
  addToCart(state.panelProduct.id, false);
  const btn=document.getElementById('panel-cart-btn');
  if(btn){btn.textContent='Added to Cart';btn.className='pbtn pbtn-added';}
  openCartPanel();
}

function panelBuyNow(){
  if(!requireSize()) return;
  closeDetailPanel();
  buyNow(state.panelProduct.id);
}

/* ─────────────────────────────────────────
   CART PANEL
───────────────────────────────────────── */
function renderCartPanel(){
  const body=document.getElementById('cart-panel-body');
  const footer=document.getElementById('cart-panel-footer');
  document.getElementById('cp-count').textContent=state.cart.length;

  if(state.cart.length===0){
    body.innerHTML='<div class="cart-empty">Your cart is empty.<br>Start shopping!</div>';
    footer.style.display='none'; return;
  }

  const subtotal=state.cart.reduce((s,i)=>s+i.price,0);
  const ship=state.cart.reduce((s,i)=>s+i.shipping,0);
  const total=subtotal+ship;

  body.innerHTML='<div style="padding:8px 0;">'+state.cart.map(it=>`
    <div class="cp-item">
      <img class="cp-item-img" src="${IMG[it.id]||''}" alt="${it.name}" loading="lazy">
      <div class="cp-item-info">
        <div class="cp-item-brand">${it.brand}</div>
        <div class="cp-item-name">${it.name}</div>
        ${it.selectedSize ? `<div style="font-size:10.5px;color:var(--muted);margin-top:1px;">Size: <strong>${it.selectedSize}</strong></div>` : ''}
        <div class="cp-item-price">&#8377;${it.price.toLocaleString()}</div>
      </div>
      <button class="cp-remove" onclick="removeFromCart('${it.id}')" title="Remove">&#10005;</button>
    </div>`).join('')+'</div>';

  document.getElementById('cp-total').innerHTML='&#8377;'+total.toLocaleString();
  document.getElementById('cp-ship-note').textContent=ship>0?`Includes ₹${ship} shipping`:'Free shipping on all items';
  footer.style.display='block';
}

function openCartPanel(){
  renderCartPanel();
  document.getElementById('cart-panel').classList.add('open');
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('chat-col').classList.add('shift-right');
}
function closeCartPanel(){
  document.getElementById('cart-panel').classList.remove('open');
  document.getElementById('chat-col').classList.remove('shift-right');
}

  { id:'card', label:'CARD',        sub:'Credit / Debit card' },
  { id:'net',  label:'NET',         sub:'Net Banking' },
  { id:'cod',  label:'COD',         sub:'Cash on Delivery' },
];

function openCheckoutPanel(){
  if(state.cart.length===0){ showToast('Your cart is empty!'); return; }
  coState.step=0; coState.selectedAddr=0; coState.selectedDel=0; coState.selectedPay=0;
  document.getElementById('cart-panel').classList.remove('open');
  document.getElementById('checkout-panel').classList.add('open');
  document.getElementById('chat-col').classList.add('shift-right');
  renderCoStep();
}

function closeCheckoutPanel(){
  document.getElementById('checkout-panel').classList.remove('open');
  document.getElementById('chat-col').classList.remove('shift-right');
}

function setCoStepUI(active){
  for(let i=0;i<3;i++){
    const s=document.getElementById('co-step-'+i);
    s.className='co-step'+(i<active?' done':i===active?' active':'');
  }
  for(let i=0;i<2;i++){
    document.getElementById('co-line-'+i).className='co-step-line'+(i<active?' done':'');
  }
  const titles=['Delivery Address','Payment Method','Order Confirmed'];
  document.getElementById('co-panel-title').textContent=titles[active]||'Checkout';
}

function coCartTotal(){
  const sub=state.cart.reduce((s,i)=>s+i.price,0);
  const ship=DELIVERY_OPTS[coState.selectedDel].val;
  return {sub, ship, total:sub+ship};
}

function renderCoStep(){
  setCoStepUI(coState.step);
  if(coState.step===0) renderCoAddress();
  else if(coState.step===1) renderCoPayment();
  else if(coState.step===2) renderCoProcessing();
}

    <div class="delivery-opts" id="del-opts">

function selectAddr(i){
  coState.selectedAddr=i;
  document.querySelectorAll('.addr-card').forEach((c,j)=>c.classList.toggle('selected',j===i));
}

function selectDel(i){
  coState.selectedDel=i;
  document.querySelectorAll('.del-opt').forEach((c,j)=>c.classList.toggle('selected',j===i));
  // update total display
  const {total}=coCartTotal();
  const el=document.getElementById('co-total-disp');
  if(el) el.innerHTML='&#8377;'+total.toLocaleString();
  // update order mini
  renderCoAddress();
}

function renderPayExtra(){

    extra.innerHTML=`<div class="card-fields">

function selectPay(i){
  coState.selectedPay=i;

}

function verifyUPI(){
  const inp=document.getElementById('upi-id-input');
  if(inp&&inp.value.includes('@')){ showToast('UPI ID verified!'); }
  else { showToast('Enter a valid UPI ID'); }
}

/* ── STEP 2: PROCESSING → SUCCESS ── */
function renderCoProcessing(){
  setCoStepUI(2);
  document.getElementById('co-body').innerHTML=`
    <div class="processing-wrap">
      <div class="processing-spinner"></div>
      <div class="processing-title">Processing Payment</div>
      <div class="processing-sub">Please wait, do not close this window…</div>
    </div>`;
  document.getElementById('co-footer').innerHTML='';

  setTimeout(()=>{
    renderCoSuccess();
  }, 2200);
}

function renderCoSuccess(){
  const {sub,ship,total}=coCartTotal();
  const oid='SPZ-2026-'+Math.floor(Math.random()*9000+1000);
  const addr=ADDRESSES[coState.selectedAddr];
  const del=DELIVERY_OPTS[coState.selectedDel];

  // Push orders to state
  state.cart.forEach(item=>{
    state.orders.push({
      id:oid, product:item.name, pid:item.id,
      date: new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}),
      status:'Confirmed',
      tracking:['Ordered','Confirmed','Shipped','Delivered'],
      currentStep:1, estimate:del.name==='Same Day Delivery'?'Today by 8 PM':del.name==='Express Delivery'?'In 1–2 days':'In 3–5 days'
    });
  });
  state.cart=[]; syncCart();

  document.getElementById('co-body').innerHTML=`
    <div class="success-wrap">
      <div class="success-check">&#10003;</div>
      <div class="success-title">Order Placed!</div>
      <div class="success-sub">Your payment was successful. We'll send updates via SMS.</div>
      <div class="success-order-box">
        <div class="success-row"><span class="lbl">Order ID</span><span class="val">${oid}</span></div>
        <div class="success-row"><span class="lbl">Items</span><span class="val">${state.orders.filter(o=>o.id===oid).length} item(s)</span></div>
        <div class="success-row"><span class="lbl">Total Paid</span><span class="val">&#8377;${total.toLocaleString()}</span></div>
        <div class="success-row"><span class="lbl">Payment</span><span class="val">${['UPI','Card','Net Banking','Cash on Delivery'][coState.selectedPay]}</span></div>
        <div class="success-row"><span class="lbl">Deliver To</span><span class="val">${addr.tag} – ${addr.name}</span></div>
        <div class="success-row"><span class="lbl">Delivery</span><span class="val">${del.name}</span></div>
        <div class="success-row"><span class="lbl">Estimate</span><span class="val" style="color:var(--accent)">${state.orders.find(o=>o.id===oid)?.estimate||'3–5 days'}</span></div>
      </div>
    </div>`;

  document.getElementById('co-footer').innerHTML=`
    <button class="co-next-btn" onclick="closeCheckoutPanel();sendQuick('Track my order');">Track Your Order</button>
    <button class="co-back-btn" onclick="closeCheckoutPanel();sendQuick('Show me cricket bats');">Continue Shopping</button>`;

  // Post message in chat
  setTimeout(()=>{
    appendMsg('ai',`<p>Your order <strong>${oid}</strong> has been placed successfully! Estimated delivery: <strong>${state.orders.find(o=>o.id===oid)?.estimate}</strong>.</p>`);
  }, 400);
}

/* ── NAV HELPERS ── */
function coNext(){
  coState.step=Math.min(coState.step+1,2);
  renderCoStep();
}
function coBack(){
  coState.step=Math.max(coState.step-1,0);
  renderCoStep();
}

function appendMsg(role,html){
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');
  const isWide = role==='ai' && html.includes('carousel-wrap');
  const isTrack = role==='ai' && html.includes('track-bar');
  let cls = `msg ${role}`;
  if(role==='ai' && isWide) cls = `msg ${role}`;
  else if(role==='ai' && isTrack) cls = `msg ${role} track-msg`;
  else if(role==='ai') cls = `msg ${role} narrow-msg`;
  div.className=cls;
  const av=document.createElement('div'); av.className='msg-av'; av.textContent=role==='ai'?'AI':'R';
  const bubble=document.createElement('div'); bubble.className='bubble'; bubble.innerHTML=html;
  div.appendChild(av); div.appendChild(bubble);
  msgs.appendChild(div); msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(){
  const msgs=document.getElementById('messages');
  const div=document.createElement('div'); div.className='msg ai'; div.id='typing-ind';
  const av=document.createElement('div'); av.className='msg-av'; av.textContent='AI';
  const b=document.createElement('div'); b.className='bubble';
  b.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  div.appendChild(av); div.appendChild(b); msgs.appendChild(div); msgs.scrollTop=msgs.scrollHeight;
}
function removeTyping(){const e=document.getElementById('typing-ind');if(e)e.remove();}

function openOrderDetailPanel(orderId, type){
  const o = state.orders.find(x=>x.id===orderId); if(!o) return;
  const img = IMG[o.pid||'c1']||'';
  const p = getProduct(o.pid||'c1');

  // Build tracking steps HTML
  const steps = o.tracking, cur = o.currentStep;
  const trackBar = `<div class="track-bar">${steps.map((s,i)=>`
    ${i>0?`<div class="track-line ${i<=cur?'done':''}"></div>`:''}
    <div class="track-step">
      <div class="track-dot ${i<cur?'done':i===cur?'active':''}">${i<cur?'&#10003;':i===cur?'&#9679;':''}</div>
      <div class="track-label ${i===cur?'active-lbl':''}">${s}</div>
    </div>`).join('')}
  </div>`;

  // Action buttons based on type
  let actions = '';
  if(type === 'reorder'){
    actions = `<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
      <button class="pbtn pbtn-solid" onclick="reorderProduct('${o.pid||'c1'}')">Reorder This Item</button>
      ${p ? `<button class="pbtn pbtn-slate" onclick="closeOrderDetailPanel();openDetailPanel('${o.pid||'c1'}')">View Product Details</button>` : ''}
    </div>`;
  } else if(type === 'delay'){
    actions = `<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
      <button class="pbtn pbtn-amber" onclick="raiseDelayTicket('${o.id}');closeOrderDetailPanel()">Raise Delay Complaint</button>
      <button class="pbtn pbtn-red" onclick="closeOrderDetailPanel();sendQuick('return my order')">Request Return</button>
    </div>`;
  } else if(type === 'refund'){
    actions = `<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
      <button class="pbtn pbtn-amber" onclick="closeOrderDetailPanel();sendQuick('refund_order_${o.id}')">Request Refund</button>
    </div>`;
  }

  // Product spec rows (if product exists in catalog)
  const productInfo = p ? `
    <div style="margin-top:14px;">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:0.5px;margin-bottom:6px;">Product Info</div>
      <div class="confirm-row"><span class="label">Brand</span><span class="val">${p.brand}</span></div>
      <div class="confirm-row"><span class="label">Price Paid</span><span class="val" style="color:var(--accent)">&#8377;${p.price.toLocaleString()}</span></div>
      <div class="confirm-row"><span class="label">Rating</span><span class="val">${stars(p.rating)}</span></div>
      <div class="confirm-row"><span class="label">Delivery</span><span class="val">${p.delivery}</span></div>
    </div>` : '';

  document.getElementById('order-detail-body').innerHTML=`
    <div style="display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--border);">
      <img src="${img}" alt="${o.product}" style="width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--surface2);flex-shrink:0;">
      <div>
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--accent);letter-spacing:0.5px;margin-bottom:3px;">Your Order</div>
        <div style="font-size:14px;font-weight:700;color:var(--text);line-height:1.3;">${o.product}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px;">${o.id}</div>
      </div>
    </div>

    <div style="margin-top:12px;">
      <div class="confirm-row"><span class="label">Order Date</span><span class="val">${o.date}</span></div>
      <div class="confirm-row"><span class="label">Status</span><span class="val" style="color:var(--accent)">${o.status}</span></div>
      <div class="confirm-row"><span class="label">Estimate</span><span class="val">${o.estimate}</span></div>
    </div>

    ${productInfo}

    <div style="margin-top:14px;">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:0.5px;margin-bottom:4px;">Tracking</div>
      ${trackBar}
    </div>
    ${actions}`;

  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('cart-panel').classList.remove('open');
  document.getElementById('order-detail-panel').classList.add('open');
  document.getElementById('chat-col').classList.add('shift-right');
}

function reorderProduct(pid){
  const p = getProduct(pid); if(!p) return;
  state.selectedSize = p.sizes[0]; // default to first size
  addToCart(pid, false);
  closeOrderDetailPanel();
  appendMsg('ai', `<p><strong>${p.name}</strong> has been added to your cart for reorder!</p>
    <div class="action-row">
      <button class="action-btn" style="background:var(--accent);border-color:var(--accent);color:#fff;" onclick="openCartPanel()">View Cart</button>
      <button class="action-btn" onclick="openDetailPanel('${pid}')">View Product</button>
    </div>`);
  setTimeout(()=>openCartPanel(), 400);
}

function closeOrderDetailPanel(){
  document.getElementById('order-detail-panel').classList.remove('open');
  document.getElementById('chat-col').classList.remove('shift-right');
}

function renderOrderListForSupport(type){

/* ─────────────────────────────────────────
   PRODUCT ACTIONS
───────────────────────────────────────── */
function addToCart(id, silent=false){
  const p=getProduct(id); if(!p) return false;
  if(state.cart.find(i=>i.id===id)){
    if(!silent) showToast(`${p.name} is already in cart!`);
    return false;
  }
  // attach selected size (from panel) or default to first size
  const size = state.selectedSize || p.sizes[0];
  state.cart.push({...p, selectedSize: size});
  syncCart();
  showToast(`${p.name} (${size}) added to cart!`);
  return true;
}

function addToCartChat(id){
  const p=getProduct(id); if(!p) return;
  const isNew=addToCart(id,true);
  appendMsg('user',`Add ${p.name} to cart`);
  setTimeout(()=>{
    removeTyping();
    if(isNew){
      appendMsg('ai',`<p><strong>${p.name}</strong> has been added to your cart!</p>`);
      openCartPanel();
    } else {
      appendMsg('ai',`<p><strong>${p.name}</strong> is already in your cart.</p>`);
      openCartPanel();
    }
  },600);
  showTyping();
}

function removeFromCart(id){
  const p=getProduct(id);
  state.cart=state.cart.filter(i=>i.id!==id);
  syncCart();
  if(p) showToast(`${p.name} removed from cart.`);
  // If panel-cart-btn is showing this product, reset it
  if(state.panelProduct&&state.panelProduct.id===id){
    const btn=document.getElementById('panel-cart-btn');
    if(btn){btn.textContent='Add to Cart';btn.className='pbtn pbtn-solid';}
  }
}

function buyNow(id){
  const p=getProduct(id); if(!p) return;
  appendMsg('user',`Buy ${p.name} now`);
  setTimeout(()=>{
    removeTyping();
    appendMsg('ai',`<p>Confirm your order for <strong>${p.name}</strong>:</p>
      <div class="confirm-row"><span class="label">Price</span><span class="val">&#8377;${p.price.toLocaleString()}</span></div>
      <div class="confirm-row"><span class="label">Shipping</span><span class="val">${p.shipping===0?'FREE':'&#8377;'+p.shipping}</span></div>
      <div class="confirm-row"><span class="label">Address</span><span class="val">New Delhi, 110001</span></div>
      <div class="action-row" style="margin-top:10px;">
        <button class="action-btn" style="background:var(--accent);border-color:var(--accent);color:#fff;" onclick="confirmOrder('${p.id}')">Confirm Order</button>
        <button class="action-btn" onclick="sendQuick('change shipping address')">Change Address</button>
      </div>`);
  },700); showTyping();
}

function confirmOrder(id){
  const p=getProduct(id); if(!p) return;
  appendMsg('user','Confirm my order');
  state.cart=state.cart.filter(i=>i.id!==id);
  syncCart();
  setTimeout(()=>{
    removeTyping();
    appendMsg('ai',renderOrderConfirmation(p));
    setTimeout(()=>appendMsg('ai',`<p>You might also like:</p>${renderRecos(p)}`),900);
  },800); showTyping();
}

function checkout(){
  if(state.cart.length===0){appendMsg('ai','<p>Your cart is empty.</p>');return;}
  const item=state.cart[0];
  appendMsg('user','Checkout');
  state.cart=[]; syncCart();
  setTimeout(()=>{removeTyping();appendMsg('ai',renderOrderConfirmation(item));},800);
  showTyping();
}

function raiseDelayTicket(orderId){
  const o=state.orders.find(x=>x.id===orderId); if(!o) return;
  const tid='TKT-'+Math.floor(Math.random()*90000+10000);

/* ─────────────────────────────────────────
   RESPOND LOGIC
───────────────────────────────────────── */

// All products flat list
function allProducts(){ return Object.values(PRODUCTS).flat(); }

// Extract price cap (max) — handles: "under 5000", "below 3k", "less than 2000", "upto 4000", "5000 budget", "₹5000", "rs 5000"
function extractPrice(m){
  const s = m.replace(/,/g,'').replace(/(\d+)\s*k\b/gi, (_, n) => String(parseInt(n)*1000));
  const patterns = [
    /under\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /below\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /less\s*than\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /upto\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /up\s*to\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /within\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /max(?:imum)?\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /(?:rs\.?|₹|inr)\s*(\d+)/,
    /(\d+)\s*(?:rs\.?|inr|rupees?|budget|max|limit)/,
  ];
  for(const re of patterns){
    const match = s.match(re);
    if(match) return parseInt(match[1]);
  }
  return null;
}

// Extract price floor (min) — handles: "starting from 2000", "above 3000", "more than 1500", "minimum 2000", "from 3000"
function extractMinPrice(m){
  const s = m.replace(/,/g,'').replace(/(\d+)\s*k\b/gi, (_, n) => String(parseInt(n)*1000));
  const patterns = [
    /starting\s*from\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /start\s*from\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /starts?\s*(?:at|@)\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /from\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /above\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /more\s*than\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /greater\s*than\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /over\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /min(?:imum)?\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /atleast\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
    /at\s*least\s*(?:rs\.?|inr|₹)?\s*(\d+)/,
  ];
  for(const re of patterns){
    const match = s.match(re);
    if(match) return parseInt(match[1]);
  }
  return null;
}

// Smart category detector
function detectCategory(m){
  // Cricket — check before generic shoe/sport keywords
  if(m.match(/cricket|willow|sg\b|mrf\b|kookaburra|batting|cricket\s*bat|cricket\s*gear|cricket\s*equipment|cricket\s*pad|cricket\s*glove|cricket\s*helmet/))
    return {label:'Cricket Gear', list:PRODUCTS.cricket};

  // Badminton
  if(m.match(/badminton|racket|racquet|shuttlecock|yonex|li-ning|li ning|victor\b|babolat|carlton\b/))
    return {label:'Badminton Rackets', list:PRODUCTS.badminton};

  // Football
  if(m.match(/football|soccer|futsal|cleat|shin\s*guard|goalkeeper|nivia|kipsta|football\s*boot|football\s*shoe/))
    return {label:'Football Gear', list:PRODUCTS.football};

  // Swimming
  if(m.match(/swim|swimming|goggle|swim\s*cap|kickboard|pool\s*gear|speedo|arena\b|tyr\b|nabaiji/))
    return {label:'Swimming Gear', list:PRODUCTS.swimming};

  // Running / Shoes — broad, catches "shoes", "sports shoes", "sneakers", brand names
  if(m.match(/shoe|shoes|sneaker|trainer|footwear|running|jogging|marathon|sprint|nike|adidas|puma\b|asics|reebok|brooks\b|hoka\b|saucony|mizuno|new\s*balance/))
    return {label:'Running Shoes', list:PRODUCTS.running};

  // Generic product/shopping queries — show all
  if(m.match(/show\s*me|show\s*all|all\s*product|browse|what.*(have|sell|got)|buy|shop|gear|equipment|sport|recommend|suggest|best|top\s*\d|budget|cheap|affordable|under\s*\d|below\s*\d|price|₹|\brs\b/))
    return {label:'All Sports Products', list:allProducts()};

  return null;
}

async function respond(userMsg){
  const m = userMsg.toLowerCase();

  // ── Product category detection (always returns carousel) ──
  const cat = detectCategory(m);
  if(cat){
    let list = cat.list;
    const maxPrice = extractPrice(m);
    const minPrice = extractMinPrice(m);

    if(minPrice !== null || maxPrice !== null){
      const filtered = list.filter(p => {
        const aboveMin = minPrice === null || p.price >= minPrice;
        const belowMax = maxPrice === null || p.price <= maxPrice;
        return aboveMin && belowMax;
      });

      if(!filtered.length){
        const rangeLabel = minPrice && maxPrice
          ? `between ₹${minPrice.toLocaleString()} – ₹${maxPrice.toLocaleString()}`
          : minPrice ? `above ₹${minPrice.toLocaleString()}` : `under ₹${maxPrice.toLocaleString()}`;
        const allPrices = list.map(p=>p.price);
        return `<p>No <strong>${cat.label}</strong> found ${rangeLabel}. Range available: ₹${Math.min(...allPrices).toLocaleString()} – ₹${Math.max(...allPrices).toLocaleString()}. Showing all:</p>${renderProducts(list)}`;
      }

      const rangeLabel = minPrice && maxPrice
        ? `between ₹${minPrice.toLocaleString()} – ₹${maxPrice.toLocaleString()}`
        : minPrice ? `starting from ₹${minPrice.toLocaleString()}` : `under ₹${maxPrice.toLocaleString()}`;
      return `<p><strong>${filtered.length} ${cat.label}</strong> ${rangeLabel}:</p>${renderProducts(filtered)}`;
    }

    return `<p>Here are all <strong>${list.length} ${cat.label}</strong> for you:</p>${renderProducts(list)}`;
  }

  // ── Cart ──
  if(m.match(/my cart|view cart|open cart|show cart|basket/)){setTimeout(()=>openCartPanel(),200);return `<p>Opening your cart.</p>`;}

  // ── Order tracking ──
  if(m.match(/track|where is my order|order status|delivery status|shipment/)){
    if(!state.orders.length) return `<p>No active orders found. Start shopping!</p>`;
    return `<p>Latest order status:</p>${renderTracking(state.orders[state.orders.length-1])}`;
  }

  // ── Order history ──
  if(m.match(/order history|my orders|past order|previous order|last purchase|show my order/)){
    if(!state.orders.length) return `<p>No previous orders found.</p>`;
    return `<p><strong>Your Order History</strong></p>${renderOrderListForSupport('reorder')}`;
  }

  // ── Reorder ──
  if(m.includes('reorder')) return state.orders.length
    ? `<p>Select the order you'd like to reorder:</p>${renderOrderListForSupport('reorder')}`
    : `<p>No previous orders.</p>`;

  // ── Return / Exchange ──
  if(m.match(/return|damaged|exchange|wrong size|change size/)){
    if(!state.orders.length) return `<p>No eligible orders for return.</p>`;
    const o=state.orders[0];
    return `<div class="return-card"><div class="return-header">Return Request Created</div>
      <div class="confirm-row"><span class="label">Order ID</span><span class="val">${o.id}</span></div>
      <div class="confirm-row"><span class="label">Product</span><span class="val">${o.product}</span></div>
      <div class="confirm-row"><span class="label">Reason</span><span class="val">${m.includes('damage')?'Damaged Product':m.includes('size')?'Wrong Size':'Customer Request'}</span></div>
      <div class="confirm-row"><span class="label">Pickup</span><span class="val" style="color:var(--accent)">Within 2 days</span></div>
      <div class="confirm-row"><span class="label">Refund</span><span class="val">5–7 business days</span></div>
    </div><p style="margin-top:8px;font-size:12px;color:var(--muted)">SMS confirmation will be sent shortly.</p>`;
  }

  // ── Support ──
  if(m.match(/support|help me|issue|problem|complaint|contact/)){
    return `<p>I'm here to help! What issue are you facing?</p>
    <div class="action-row">
      <button class="action-btn" onclick="sendQuick('My order is delayed')">Order Delayed</button>
      <button class="action-btn" onclick="sendQuick('Refund status')">Refund Status</button>
      <button class="action-btn" onclick="sendQuick('Payment issue')">Payment Issue</button>
    </div>`;
  }

  // ── Delay ──
  if(m.match(/delay|late|not arrived|hasn't come/)){
    if(!state.orders.length) return `<p>No orders found.</p>`;
    return `<p>Sorry about the delay. Select the order:</p>${renderOrderListForSupport('delay')}`;
  }

  // ── Refund ──
  if(m.includes('refund')){
    if(!state.orders.length) return `<p>No orders found.</p>`;
    return `<p>Let's sort your refund. Which order?</p>${renderOrderListForSupport('refund')}`;
  }

  // ── Payment ──
  if(m.match(/payment|transaction|charged|debit|upi fail/)){
    return `<p>Sorry about the payment issue. Please check:</p>
    <div class="confirm-row" style="margin-top:6px;"><span class="label">Bank Charges</span><span class="val">Auto-reversed in 3–5 days</span></div>
    <div class="confirm-row"><span class="label">Failed Payment</span><span class="val">Amount not debited if failed</span></div>
    <div class="confirm-row"><span class="label">UPI Issues</span><span class="val">Retry after 30 minutes</span></div>`;
  }

  // ── Internal support flow triggers ──
  if(m.startsWith('delay_order_')){
    const oid=m.replace('delay_order_','');
    const o=state.orders.find(x=>x.id===oid); if(!o) return `<p>Order not found.</p>`;
    return `<p>Status for <strong>${o.product}</strong>:</p>${renderTracking(o)}
    <div class="action-row" style="margin-top:6px;">
      <button class="action-btn" onclick="sendQuick('return my order')">Return Item</button>
      <button class="action-btn" style="border-color:var(--accent);color:var(--accent);" onclick="raiseDelayTicket('${o.id}')">Raise Complaint</button>
    </div>`;
  }
  if(m.startsWith('refund_order_')){
    const oid=m.replace('refund_order_','');
    const o=state.orders.find(x=>x.id===oid); if(!o) return `<p>Order not found.</p>`;
    const tid='TKT-'+Math.floor(Math.random()*90000+10000);
    return `<div class="order-confirm">
      <div class="confirm-header">Refund Request Raised</div>
      <div class="confirm-row"><span class="label">Ticket ID</span><span class="val">${tid}</span></div>
      <div class="confirm-row"><span class="label">Order</span><span class="val">${o.product}</span></div>
      <div class="confirm-row"><span class="label">Refund Status</span><span class="val" style="color:var(--warn)">Under Review</span></div>
      <div class="confirm-row"><span class="label">Timeline</span><span class="val">5–7 business days</span></div>
      <div class="confirm-row"><span class="label">Mode</span><span class="val">Original Payment Method</span></div>
    </div>`;
  }

  // ── Address ──
  if(m.includes('address')) return `<p>Saved address: <strong>New Delhi, 110001, India</strong></p><div class="action-row"><button class="action-btn">Keep This</button><button class="action-btn">Update Address</button></div>`;

  return null; // falls through to API
}

/* ─────────────────────────────────────────
   SEND MESSAGE
───────────────────────────────────────── */
async function sendMessage(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim(); if(!text) return;
  input.value='';
  appendMsg('user',text);
  showTyping();
  await new Promise(r=>setTimeout(r,680));
  removeTyping();
  const local=await respond(text);
  if(local){appendMsg('ai',local);return;}
  // API fallback — but first try to detect a product intent from Claude's reply
  showTyping();
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,
        system:`You are SportZone AI for India. We sell: cricket gear, running shoes, badminton rackets, football gear, swimming accessories.
If the user is asking about products, gear, equipment, sports items, or shopping — reply with ONLY one of these exact words: CRICKET, RUNNING, BADMINTON, FOOTBALL, SWIMMING, ALL.
If it is NOT a product/shopping query (e.g. greetings, general chat) — reply with a single short friendly sentence only, no product lists.`,
        messages:[{role:"user",content:text}]})
    });
    const data=await res.json();
    removeTyping();
    const reply=(data.content?.[0]?.text||'').trim();
    // If Claude returned a category keyword, show catalog
    const catMap={CRICKET:PRODUCTS.cricket,RUNNING:PRODUCTS.running,BADMINTON:PRODUCTS.badminton,FOOTBALL:PRODUCTS.football,SWIMMING:PRODUCTS.swimming,ALL:allProducts()};
    const catKey=Object.keys(catMap).find(k=>reply===k);
    if(catKey){
      const label=catKey.charAt(0)+catKey.slice(1).toLowerCase();
      appendMsg('ai',`<p>Here are our <strong>${label}</strong> products for you:</p>${renderProducts(catMap[catKey])}`);
    } else {
      appendMsg('ai',`<p>${reply||"How can I help you today?"}</p>
        <div class="action-row">
          <button class="action-btn" onclick="sendQuick('Show me cricket bats')">Cricket</button>
          <button class="action-btn" onclick="sendQuick('Show me running shoes')">Running Shoes</button>
          <button class="action-btn" onclick="sendQuick('Show me badminton rackets')">Badminton</button>
          <button class="action-btn" onclick="sendQuick('Show me footballs')">Football</button>
        </div>`);
    }
  }catch{
    removeTyping();
    appendMsg('ai',`<p>What sport are you shopping for today?</p>
      <div class="action-row">
        <button class="action-btn" onclick="sendQuick('Show me cricket bats')">Cricket</button>
        <button class="action-btn" onclick="sendQuick('Show me running shoes')">Running Shoes</button>
        <button class="action-btn" onclick="sendQuick('Show me badminton rackets')">Badminton</button>
        <button class="action-btn" onclick="sendQuick('Show me footballs')">Football</button>
      </div>`);
  }
}

function sendQuick(text){document.getElementById('chat-input').value=text;sendMessage();}
function handleKey(e){if(e.key==='Enter')sendMessage();}
